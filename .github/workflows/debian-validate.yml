name: Validate Debian build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    - uses: actions/cache@v4
      with:
        path: |
          /home/runner/.ccache
          /home/runner/.cache/ccache
          /home/runner/.cache/sbuild
        key: debian-validate:${{ matrix.os }}:${{ github.sha }}
        restore-keys: 'debian-validate:${{ matrix.os }}:'
    - name: disable man-db trigger
      run: |
        echo "set man-db/auto-update false" | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
    - name: install deps
      run: |
        ln -s build/debian debian
        sudo apt update
        sudo apt satisfy --yes --no-install-recommends build-essential "`perl .github/scripts/print-build-deps.pl`"
    - name: build
      run: dpkg-buildpackage --no-sign -b -j4
    - name: test prepare
      run: |
        sudo apt install --yes autopkgtest mmdebstrap
        if [ ! -f ~/.cache/sbuild/${{ matrix.os }}-amd64.tar ]; then
          mkdir -p ~/.cache/sbuild
          mmdebstrap --mode=unshare --variant=apt --skip=output/mknod,cleanup/apt/lists '--customize-hook=sed "s/^deb /deb-src /" "$1/etc/apt/sources.list" > "$1/etc/apt/sources.list.d/src.list" && APT_CONFIG=$MMDEBSTRAP_APT_CONFIG apt-get update' noble ~/.cache/sbuild/${{ matrix.os }}-amd64.tar
        fi
        autopkgtest ../buildtest_*.deb . -- unshare --release ${{ matrix.os }}

